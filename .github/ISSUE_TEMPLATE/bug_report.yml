name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems must NOT be reported here. Use SECURITY.md (private reporting).
  - type: input
    id: version
    attributes:
      label: jollyroger version or commit
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: go1.27.1
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [PostgreSQL, SQLite, in-memory (tests)]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code or steps that show the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
