# Local development and integration tests. Not needed to USE jollyroger: in production it uses the
# database your application already has.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jollyroger
      POSTGRES_PASSWORD: jollyroger # local development only
      POSTGRES_DB: jollyroger_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jollyroger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
